name: Build and Push to ACR

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/web-naive/**'
      - 'packages/**'
      - 'internal/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  REGISTRY: crpi-dsaw9owrbrng40lv.cn-beijing.personal.cr.aliyuncs.com
  IMAGE_NAMESPACE: vben-xs

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vben-admin-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vben-admin-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-naive/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vben-admin-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vben-admin-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
